  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Blog o Tuzli | Apartmani Elegance",
    "url": "https://apartmanielegance.ba/blog/",
    "description": "Vodiči i preporuke za posjetitelje Tuzle od Apartmani Elegance",
    "publisher": {
      "@type": "Organization",
      "name": "Apartmani Elegance",
      "url": "https://apartmanielegance.ba/",
      "logo": "https://apartmanielegance.ba/images/elegance-logo-navbar.svg"
    }
  }
  </script>
</head>

<body>
  <div id="ael-navbar"></div>
    <!-- Blog listing hero -->
  <section style="background:#070707; padding:120px 5vw 72px; text-align:center;">
    <p style="font-family:'Josefin Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b98b2c;margin-bottom:16px;">Vodiči i savjeti</p>
    <h1 style="font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,48px);color:#fff5ea;margin:0 auto 16px;max-width:700px;line-height:1.2;">Blog o Tuzli i okolini</h1>
    <p style="font-family:'Open Sans',sans-serif;font-size:16px;color:#6b6b6b;max-width:480px;margin:0 auto;line-height:1.6;">Preporuke za posjetitelje: šta vidjeti, gdje otići i kako isplanirati odmor u Tuzli.</p>
  </section>

  <!-- Blog grid -->
  <section class="ael-blog-listing">
    <div id="ael-blog-grid" class="ael-blog-grid">
      <!-- Populated by JS below -->
    </div>
  </section>

  <!-- Footer -->
  <div id="ael-footer"></div>
    <script src="/js/components.js"></script>
    <script src="../js/webflow.js" type="text/javascript"></script>

  <script>
    (function () {
      var grid = document.getElementById("ael-blog-grid");

      fetch("posts.json")
        .then(function (r) { return r.json(); })
        .then(function (posts) {
          grid.innerHTML = posts.map(function (p) {
            var imgTag = p.image
              ? '<img class="ael-blog-card__img" src="' + p.image + '" alt="' + p.title + '" loading="lazy">'
              : '<div class="ael-blog-card__img"></div>';
            return '<a class="ael-blog-card" href="' + p.slug + '.html">' +
              imgTag +
              '<div class="ael-blog-card__body">' +
                '<span class="ael-blog-card__cat">' + p.category + '</span>' +
                '<h2 class="ael-blog-card__title">' + p.title + '</h2>' +
                '<p class="ael-blog-card__excerpt">' + p.excerpt + '</p>' +
                '<span class="ael-blog-card__meta">' + formatDate(p.date) + '</span>' +
              '</div>' +
            '</a>';
          }).join("");
        })
        .catch(function () {
          grid.innerHTML = '<p style="color:#6b6b6b;font-family:\'Open Sans\',sans-serif;text-align:center;">Nije moguće učitati postove.</p>';
        });

      function formatDate(iso) {
        var d = iso.split("-");
        var months = ["januar","februar","mart","april","maj","juni","juli","avgust","septembar","oktobar","novembar","decembar"];
        return d[2] + ". " + months[parseInt(d[1], 10) - 1] + " " + d[0] + ".";
      }
    })();
  </script>

</body>
</html>
